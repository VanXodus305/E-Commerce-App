# Copy to the Android application's .github/workflows/android-static-analysis.yml.
# Replace OWNER/REPOSITORY with this agent's repository and pin a release tag.
name: Android static analysis
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  security-events: write
  pull-requests: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/*.gradle.kts
            **/gradle-wrapper.properties
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Restore analysis tool cache
        id: analysis-tools-cache
        uses: actions/cache/restore@v6
        with:
          path: .android-static-agent-tools
          key: ${{ runner.os }}-android-static-agent-tools-v1-${{ hashFiles('.github/workflows/android-static-analysis.yml') }}
      - name: Install missing analysis tools
        run: |
          tools_dir="$GITHUB_WORKSPACE/.android-static-agent-tools"
          if [ ! -x "$tools_dir/venv/bin/python" ]; then
            python -m venv "$tools_dir/venv"
          fi
          if [ ! -x "$tools_dir/venv/bin/semgrep" ]; then
            "$tools_dir/venv/bin/python" -m pip install semgrep
          fi
          if [ ! -x "$tools_dir/bin/gitleaks" ]; then
            mkdir -p "$tools_dir/bin"
            export GOBIN="$tools_dir/bin"
            go install github.com/zricethezav/gitleaks/v8@v8.30.1
          fi
          echo "$tools_dir/venv/bin" >> "$GITHUB_PATH"
          echo "$tools_dir/bin" >> "$GITHUB_PATH"
      - name: Run Android static analysis
        id: analysis
        continue-on-error: true
        uses: philips-internal/static-analysis-agent@v1.5.0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          path: .
          run-tools: 'true'
          changed-only: 'true'
          gemini-model: gemini-3.5-flash-lite
          python-command: ${{ github.workspace }}/.android-static-agent-tools/venv/bin/python
      - name: Save analysis tool cache
        if: always() && steps.analysis-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .android-static-agent-tools
          key: ${{ steps.analysis-tools-cache.outputs.cache-primary-key }}
      - name: Publish pull-request summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- android-static-analysis-agent -->';
            if (!fs.existsSync('android-static-agent-comment.md')) {
              core.warning('The analysis comment file was not produced.');
              return;
            }
            let body = fs.readFileSync('android-static-agent-comment.md', 'utf8');
            body += `\n\n[Open the detailed workflow report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Publish pushed-commit summary
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('android-static-agent-comment.md')) {
              core.warning('The analysis comment file was not produced.');
              return;
            }
            let body = fs.readFileSync('android-static-agent-comment.md', 'utf8');
            body += `\n\n[Open the detailed workflow report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
      - name: Add report to the workflow summary
        if: always()
        run: |
          if [ -f android-static-agent.md ]; then
            echo "# Findings in changed files" >> "$GITHUB_STEP_SUMMARY"
            cat android-static-agent.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f android-static-agent-repository.md ]; then
            echo "# Findings across the repository" >> "$GITHUB_STEP_SUMMARY"
            echo "This inventory provides repository context. The analysis gate and commit/PR comment use only findings in changed files." >> "$GITHUB_STEP_SUMMARY"
            cat android-static-agent-repository.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: android-static-agent.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-static-analysis
          path: |
            android-static-agent.sarif
            android-static-agent.md
            android-static-agent-comment.md
            android-static-agent-repository.md
      - name: Enforce analysis policy
        if: steps.analysis.outcome == 'failure'
        run: exit 1
